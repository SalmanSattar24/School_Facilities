[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "school-facilities"
version = "0.1.0"
description = "Reproducible school-facilities imagery review and confidence calibration pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
pilot = [
  "google-genai==2.20.0",
  "jsonschema==4.26.0",
  "numpy==2.5.2",
  "planetary-computer==1.0.0",
  "pystac-client==0.9.0",
  "rasterio==1.5.1",
]

[project.scripts]
school-facilities = "school_facilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
